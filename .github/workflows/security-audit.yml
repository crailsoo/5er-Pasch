name: 5er Pasch security & bounded live probe

on:
  push:
    branches:
      - security/site-hardening-audit-2026-11
  pull_request:
    paths:
      - 'public/_headers'
      - 'functions/**'
      - 'tests/security-*.mjs'
      - '.github/workflows/security-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Security regression tests
        run: node --test tests/security-*.mjs
      - name: Bounded live probe of public website
        run: node tests/live-site-check.mjs
